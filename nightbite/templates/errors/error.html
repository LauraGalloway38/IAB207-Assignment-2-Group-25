
{% extends 'base.html' %}

{% block title %}{{ code }} | NIGHTBITE{% endblock %}

{% block content %}

<main class="error-page">

    <div class="container">

        <section class="error-card">

            <span class="error-code">
                {{ code }}
            </span>

            <p class="section-kicker">
                Something went wrong
            </p>

            <h1>{{ heading }}</h1>

            <p>{{ message }}</p>

            <a class="btn btn-nightbite"
               href="{{ url_for('main.index') }}">

                <i class="bi bi-arrow-left me-2"></i>
                Back to Discover

            </a>

        </section>

    </div>

</main>

{% endblock %}
