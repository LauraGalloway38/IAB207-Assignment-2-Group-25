<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}My Events{% endblock %} | NIGHTBITE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <!-- Event management navigation - Aarnav's section -->
    <nav class="navbar navbar-dark nightbite-navbar">
        <div class="container flex-wrap gap-3">
            <a class="navbar-brand nightbite-logo" href="{{ url_for('main.index') }}">NIGHT<span>BITE</span></a>
            <div class="d-flex flex-wrap gap-3">
                <a class="text-white" href="{{ url_for('main.index') }}">Discover</a>
                <a class="text-white" href="{{ url_for('main.create_event') }}">Create Event</a>
                <a class="text-white" href="{{ url_for('main.my_events') }}">My Events</a>
                <a class="text-white" href="{{ url_for('main.bookings') }}">My Bookings</a>
            </div>
        </div>
    </nav>
    <main class="container py-5">
        {% for message in get_flashed_messages() %}
            <div class="alert alert-info" role="status">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
